name: Staging to Main Promotion

# On every push to staging this workflow immediately creates the draft PR staging -> main
# (label: automated-promotion), so the pre-release checks run in the context of that PR and
# release progress is observable there. The draft state prevents accidental merging; the
# "only on successful pre-release" guarantee is preserved via main's required checks,
# which the PR has to pass anyway. The final merge must be approved and completed manually
# by a maintainer.
#
# A pure back-merge from main produces no PR: the "main is behind staging" check
# below treats a tree identical to main as commits_ahead=0. An already open
# staging -> main PR is never duplicated.

on:
  push:
    branches: [staging]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: staging-to-main-promotion
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout staging
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Fetch main
        run: git fetch origin main

      - name: Check if main is behind staging
        id: diff
        run: |
          changed="$(git diff --name-only origin/main HEAD)"
          if [ -z "$changed" ]; then
            echo "commits_ahead=0" >> "$GITHUB_OUTPUT"
          else
            echo "commits_ahead=$(git rev-list origin/main..HEAD --count)" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure automated-promotion label exists
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create automated-promotion --color "0E8A16" --description "Automated PR from staging to main" --force

      - name: Create promotion pull request
        if: steps.diff.outputs.commits_ahead != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing="$(gh pr list --base main --head staging --state open --json number)"
          if [ "$(echo "$existing" | jq length)" -eq 0 ]; then
            gh pr create \
              --base main --head staging \
              --title "Automated promotion from staging to main" \
              --body "Automated promotion from staging to main. Contains all changes integrated on staging; the pre-release checks run in the context of this PR. Requires manual review and merge by a maintainer." \
              --draft \
              --label "automated-promotion"
          fi
