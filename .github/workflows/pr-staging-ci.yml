name: PR CI for Staging

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: pr-staging-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  detect-backmerge:
    runs-on: ubuntu-latest
    outputs:
      is_backmerge: ${{ steps.check.outputs.is_backmerge }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0

      - name: Check whether this PR is a pure back-merge from main
        id: check
        run: |
          git fetch origin main:refs/remotes/origin/main --no-tags

          main_sha="$(git rev-parse origin/main)"
          is_main_merge_parent=false
          for parent in $(git show -s --format=%P HEAD); do
            if [[ "$parent" == "$main_sha" ]]; then
              is_main_merge_parent=true
              break
            fi
          done

          if [[ "$is_main_merge_parent" == "true" ]]; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Back-merge from main detected - CI checks will be skipped."
          elif git diff --quiet origin/main HEAD; then
            echo "is_backmerge=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Pure back-merge from main detected (tree identical) - CI checks will be skipped."
          else
            echo "is_backmerge=false" >> "$GITHUB_OUTPUT"
          fi

  static-checks:
    name: static checks
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      IncludeIosTarget: false
      IncludeAndroidTarget: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload restore Reporter.sln

      - name: Restore
        run: dotnet restore Reporter.sln -r win-x64

      - name: Format check
        run: dotnet format Reporter.sln --verify-no-changes --no-restore --severity error

      - name: License header check
        run: node scripts/add-license-headers.mjs --check

      - name: Security scan
        uses: ./.github/actions/security-scan
        with:
          solution-path: Reporter.sln
          artifact-name: vulnerable-packages-pr

      - name: Static analysis
        run: dotnet build Reporter.sln --configuration Release --no-restore -p:TreatWarningsAsErrors=true

  build-and-test:
    name: build & test
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      IncludeIosTarget: false
      IncludeAndroidTarget: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload restore Reporter.sln

      - name: Restore
        run: dotnet restore Reporter.sln -r win-x64

      - name: Build
        run: dotnet build Reporter.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test --project src/Reporter.Tests/Reporter.Tests.csproj --configuration Release --no-build
          -- --coverlet --coverlet-output-format cobertura
          --coverlet-include "[Reporter.*]*"
          --coverlet-exclude "[*]Reporter.Data.Migrations.*"
          --filter-not-trait "Category=OsInterface"
          --report-trx --report-trx-filename test-results.trx

      - name: Install ReportGenerator
        run: dotnet tool install -g dotnet-reportgenerator-globaltool --version 5.5.11

      - name: Generate coverage report
        shell: bash
        run: reportgenerator "-reports:**/coverage.cobertura*.xml" "-targetdir:coverage-report" "-reporttypes:TextSummary"

      - name: Enforce coverage threshold
        shell: bash
        env:
          COVERAGE_THRESHOLD: '70'
        run: |
          set -euo pipefail
          summary="coverage-report/Summary.txt"
          if ! grep -q "Line coverage:" "$summary"; then
            echo "Could not determine line coverage from the generated report." >&2
            exit 1
          fi
          coverage="$(grep -m1 "Line coverage:" "$summary" | grep -oE '[0-9]+([.,][0-9]+)?' | head -n1 | tr ',' '.')"
          threshold="$COVERAGE_THRESHOLD"
          echo "Line coverage: ${coverage}% (threshold: ${threshold}%)"
          awk -v cov="$coverage" -v thr="$threshold" 'BEGIN { exit !(cov >= thr) }'

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: coverage-report-pr
          path: coverage-report/
          retention-days: 14

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-results-pr
          path: TestResults/*.trx
          retention-days: 14

  # Best-effort lane for OS-sensitive tests (Category=OsInterface). Runs visibly
  # but never blocks the PR: continue-on-error keeps the job result neutral.
  # Deliberately not part of any needs-chain of the gate jobs.
  os-interface-tests:
    name: os-interface tests
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge != 'true'
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      IncludeIosTarget: false
      IncludeAndroidTarget: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
        with:
          dotnet-version: '10.0.x'

      - name: Install .NET MAUI workload
        run: dotnet workload restore Reporter.sln

      - name: Restore
        run: dotnet restore Reporter.sln -r win-x64

      - name: Build
        run: dotnet build Reporter.sln --configuration Release --no-restore

      - name: Test (OsInterface)
        shell: pwsh
        run: >
          dotnet test --project src/Reporter.Tests/Reporter.Tests.csproj --configuration Release --no-build
          -- --filter-trait "Category=OsInterface"
          --report-trx --report-trx-filename test-results-os-interface.trx

      - name: Retry flaky tests once
        # if: failure() is deliberately broad: on a build failure or missing TRX the script
        # reports "keine Flaky-Fehlschlaege" and exits 0, so the original failing step stays
        # the leading signal. Persistent flaky failures make this step fail - the job still
        # stays non-blocking via job-level continue-on-error.
        if: failure()
        shell: pwsh
        run: |
          & scripts/Retry-FlakyTests.ps1 -TestProject src/Reporter.Tests/Reporter.Tests.csproj -PrimaryTrx TestResults/test-results-os-interface.trx -Configuration Release
          # All normal paths of the script end the process via its own exit; reaching
          # the next line means an unexpected abort. A stale $LASTEXITCODE must then
          # not be propagated as success.
          if (-not $?) { exit 1 }
          exit ($LASTEXITCODE ?? 0)

      - name: Analyze flaky test results
        # Pure visibility report over this run's TestResults directory (always exit 0).
        if: always()
        shell: pwsh
        run: |
          & scripts/Analyze-FlakyTestResults.ps1 -Path TestResults

      - name: Upload OS-interface test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: test-results-os-interface-pr
          path: TestResults/*os-interface*.trx
          retention-days: 14

  back-merge-skip:
    needs: detect-backmerge
    if: needs.detect-backmerge.outputs.is_backmerge == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Back-merge detected
        run: echo "This PR is a pure back-merge from main - all checks skipped."
