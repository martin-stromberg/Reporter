name: Scheduled Architecture Review

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: review-architecture
  cancel-in-progress: false

jobs:
  create-review-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Ensure scheduled-architecture-review label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create scheduled-architecture-review --color "5319E7" --description "Scheduled architecture and security review issue" --force

      - name: Create review issue if none open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh issue list --label scheduled-architecture-review --state open --json number)"
          if [ "$(echo "$existing" | jq length)" -eq 0 ]; then
            gh issue create \
              --title "Architektur- und Sicherheitsreview $(date -u +'%Y-%m')" \
              --body "@softwarewerkstatt Bitte führe ein Architektur- und Sicherheitsreview durch. Prüfe insbesondere: Neue Sicherheitsrisiken in verwendeten Frameworks und Bibliotheken; Bekannte Schwachstellen (CVEs) in NuGet-Abhängigkeiten; Neue Empfehlungen für ASP.NET Core, Blazor, .NET und verwandte Technologien; Änderungen bei Authentifizierung und Autorisierung; Neue oder inzwischen bevorzugte Design Patterns; Veraltete, abgekündigte oder problematische APIs; Verbesserungsmöglichkeiten hinsichtlich Wartbarkeit, Erweiterbarkeit und Testbarkeit; Aktuelle Empfehlungen zu Logging, Telemetrie und Monitoring; Relevante Erkenntnisse aus der Community, Microsoft-Dokumentation und Sicherheitsmeldungen. Erstelle eine priorisierte Liste konkreter Handlungsempfehlungen." \
              --label "scheduled-architecture-review"
          else
            echo "An open issue with label scheduled-architecture-review already exists; skipping creation."
          fi
