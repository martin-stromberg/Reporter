name: Security scan

inputs:
  solution-path:
    required: true
  artifact-name:
    required: true

runs:
  using: composite
  steps:
    - name: Scan for vulnerable packages
      shell: bash
      run: |
        set -o pipefail
        output="$(dotnet list "${{ inputs.solution-path }}" package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt)"
        if echo "$output" | grep -qi "has the following vulnerable packages\|Severity"; then
          echo "::error::Vulnerable packages detected - see the uploaded report."
          exit 1
        fi

    - name: Audit npm toolchain
      shell: bash
      run: |
        set -o pipefail
        if ! npm audit --package-lock-only --audit-level=high 2>&1 | tee npm-audit.txt; then
          echo "::error::Vulnerable npm dependencies detected - see the uploaded report."
          exit 1
        fi

    - name: Upload report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          vulnerable-packages.txt
          npm-audit.txt
        retention-days: 14
