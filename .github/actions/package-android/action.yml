name: Package Android

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature across the packaging actions.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI workload
      run: dotnet workload restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Restore
      run: dotnet restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Publish (android)
      run: >
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }}
        --configuration Release --framework net10.0-android
        -p:AndroidPackageFormat=apk --no-restore
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Collect Android package
      shell: pwsh
      run: |
        function Resolve-SingleApk {
          param([array]$Candidates, [string]$Kind)
          $names = @($Candidates | ForEach-Object { $_.Name } | Select-Object -Unique)
          if ($names.Count -gt 1) {
            throw "Multiple distinct $Kind .apk artifacts found under src/Reporter/bin/Release: $($names -join ', '). Expected exactly one."
          }
          if ($names.Count -eq 0) { return $null }
          # dotnet publish writes the same artifact to both the TFM directory and publish/.
          $inPublish = @($Candidates | Where-Object { ($_.DirectoryName -replace '\\', '/') -match '/publish$' })
          if ($inPublish.Count -ge 1) { return $inPublish[0] }
          return ($Candidates | Sort-Object FullName)[0]
        }
        $all = @(Get-ChildItem -Path "src/Reporter/bin/Release" -Recurse -Filter "*.apk" | Sort-Object FullName)
        $signed = @($all | Where-Object { $_.Name -like "*-Signed.apk" })
        $apk = Resolve-SingleApk -Candidates $signed -Kind "signed"
        if (-not $apk) {
          $unsigned = @($all | Where-Object { $_.Name -notlike "*-Signed.apk" })
          $apk = Resolve-SingleApk -Candidates $unsigned -Kind "unsigned"
          if (-not $apk) {
            throw "No .apk artifact found under src/Reporter/bin/Release after publish."
          }
          Write-Warning "No signed *-Signed.apk found; falling back to unsigned APK '$($apk.Name)'."
        }
        Copy-Item -Path $apk.FullName -Destination "release-android.apk" -Force
