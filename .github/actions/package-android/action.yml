name: Package Android

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature across the packaging actions.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI workload
      run: dotnet workload restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Restore
      run: dotnet restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Publish (android)
      run: >
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }}
        --configuration Release --framework net10.0-android
        -p:AndroidPackageFormat=apk --no-restore
      shell: bash
      env:
        IncludeIosTarget: false
        IncludeAndroidTarget: true

    - name: Collect Android package
      shell: pwsh
      run: |
        $signed = @(Get-ChildItem -Path "src/Reporter/bin/Release" -Recurse -Filter "*-Signed.apk")
        if ($signed.Count -gt 1) {
          throw "Multiple signed .apk artifacts found under src/Reporter/bin/Release: $($signed.Name -join ', '). Expected exactly one."
        }
        if ($signed.Count -eq 1) {
          $apk = $signed[0]
        } else {
          $unsigned = @(Get-ChildItem -Path "src/Reporter/bin/Release" -Recurse -Filter "*.apk" | Where-Object { $_.Name -notlike "*-Signed.apk" })
          if ($unsigned.Count -gt 1) {
            throw "Multiple unsigned .apk artifacts found under src/Reporter/bin/Release: $($unsigned.Name -join ', '). Expected exactly one."
          }
          if ($unsigned.Count -eq 0) {
            throw "No .apk artifact found under src/Reporter/bin/Release after publish."
          }
          Write-Warning "No signed *-Signed.apk found; falling back to unsigned APK '$($unsigned[0].Name)'."
          $apk = $unsigned[0]
        }
        Copy-Item -Path $apk.FullName -Destination "release-android.apk" -Force
