name: Package iOS

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature across the packaging actions.
    required: true
  codesign-key:
    description: iOS signing identity passed as -p:CodesignKey (e.g. Apple Distribution), provided by the caller from repository secrets.
    required: false
    default: ''
  provisioning-profile:
    description: iOS provisioning profile passed as -p:CodesignProvision, provided by the caller from repository secrets.
    required: false
    default: ''
  api-key-id:
    description: App Store Connect API key ID. When set together with api-key-p8/api-issuer-id, the built .ipa is uploaded to TestFlight via iTMSTransporter.
    required: false
    default: ''
  api-issuer-id:
    description: App Store Connect API issuer ID.
    required: false
    default: ''
  api-key-p8:
    description: App Store Connect API private key (.p8 contents), provided by the caller from repository secrets.
    required: false
    default: ''
  certificate-p12-base64:
    description: Base64-encoded .p12 export of the distribution certificate including private key (Keychain Access export).
    required: false
    default: ''
  certificate-p12-password:
    description: Password of the exported .p12.
    required: false
    default: ''
  provisioning-profile-base64:
    description: Base64-encoded .mobileprovision file.
    required: false
    default: ''
  ios-workload-version:
    description: Microsoft.iOS.Sdk pack/manifest version to pin before workload restore. Must be compatible with a release Xcode on the runner - App Store rejects builds from beta Xcode. Explicitly coupled to the xcode-path input (pack 27.2.x requires exactly Xcode 27.2).
    required: false
    default: '27.2.11039'
  xcode-path:
    description: Path to the Xcode.app on the runner, activated via DEVELOPER_DIR in the 'Select Xcode' step. Must match the ios-workload-version pin (pack 27.2.x requires exactly Xcode 27.2). Must point at the release app explicitly - App Store rejects builds from beta Xcode, and the xcode-27 image also carries betas (Xcode_*_beta.app), so keep this on Xcode_27.2.app.
    required: false
    default: '/Applications/Xcode_27.2.app'

runs:
  using: composite
  steps:
    # Xcode explizit waehlen: das Runner-Image xcode-27 bringt Xcode
    # 27.0/27.1(default)/27.2 mit - der Workload-Pin
    # (ios-workload-version, Pack 27.2.11039) verlangt aber exakt
    # Xcode 27.2 und wuerde sonst erst im Publish mit 'requires
    # Xcode 27.2' abbrechen. DEVELOPER_DIR statt 'sudo xcode-select
    # -s': kein sudo noetig, gilt automatisch fuer alle Folgeschritte
    # (auch die xcode-select -p-Aufloesung von iTMSTransporter im
    # Upload). Erster Schritt = Fail-fast bei fehlender App bzw. bei
    # einem Pfad ohne 'Contents/Developer' (kein Xcode-Bundle).
    - name: Select Xcode
      run: |
        set -euo pipefail
        XCODE_APP="${{ inputs.xcode-path }}"
        if [ ! -d "$XCODE_APP" ]; then
          echo "::error::Xcode not found at '$XCODE_APP'. The pinned iOS workload (${{ inputs.ios-workload-version }}) requires a matching release Xcode - adjust the 'xcode-path' input or the runner image."
          exit 1
        fi
        if [ ! -d "$XCODE_APP/Contents/Developer" ]; then
          echo "::error::'$XCODE_APP' exists but is not a usable Xcode bundle ('Contents/Developer' is missing). Point 'xcode-path' at a release Xcode.app matching the pinned workload (${{ inputs.ios-workload-version }})."
          exit 1
        fi
        echo "DEVELOPER_DIR=$XCODE_APP/Contents/Developer" >> "$GITHUB_ENV"
        export DEVELOPER_DIR="$XCODE_APP/Contents/Developer"
        xcodebuild -version
        xcodebuild -showsdks | grep -i 'iphoneos' || true
      shell: bash

    # SDK-Band 11.0.1xx pinnen: die iOS-Workload-Manifeste werden pro
    # SDK-Band publiziert; der gepinnte Pack (net11.0_27.2,
    # Release-Xcode-kompatibel) existiert im 11.0.100-Feed.
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6
      with:
        dotnet-version: '11.0.1xx'

    # global.json nur im CI-Workspace: der Runner bringt zusaetzlich ein
    # neueres SDK mit; ohne global.json waehlt der Host-Resolver
    # immer das hoechste SDK und der Workload-Band waere unbestimmt.
    # Die Datei wird absichtlich nicht committed - lokal darf jede
    # 11.0.x-SDK verwendet werden.
    - name: Pin SDK band for this job
      run: |
        printf '{"sdk":{"version":"11.0.100","rollForward":"latestPatch","allowPrerelease":false}}\n' > global.json
        dotnet --version
      shell: bash

    # Workload-Version pinnen: 'workload restore' aktualisiert die
    # Manifeste immer auf 'latest' (aktuell 27.x mit Beta-Xcode-
    # Anforderung - Store lehnt Beta ab) und wuerde den Pin wieder
    # deinstallieren. Deshalb: erst per Rollback-File das iOS-Manifest
    # pinnen, dann mit --skip-manifest-update installieren, damit exakt
    # die gepinnte Manifest-Version aufgeloest wird.
    - name: Install .NET MAUI workload
      run: |
        set -euo pipefail
        printf '{"microsoft.net.sdk.ios": "%s"}\n' "${{ inputs.ios-workload-version }}" > "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload install maui-ios ios --skip-manifest-update
        # Auf dem Runner vorinstallierte iOS-Packs anderer Version
        # entfernen: die TPV-Resolution wuerde sonst das neueste Pack
        # waehlen - unabhaengig vom gepinnten Manifest.
        for d in "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.net11.0_*/*/; do
          [ -d "$d" ] || continue
          [ "$(basename "$d")" = "${{ inputs.ios-workload-version }}" ] || rm -rf "$(dirname "$d")"
        done
      shell: bash
      env:
        IncludeAndroidTarget: false

    # -r ios-arm64 ist Pflicht: publish unten laeuft mit
    # --no-restore und braucht das RID-Ziel im assets file.
    - name: Restore
      run: dotnet restore src/Reporter/Reporter.csproj -r ios-arm64
      shell: bash
      env:
        IncludeAndroidTarget: false

    # Signatur-Material importieren: das Runner-Image hat weder
    # Distribution-Zertifikat noch Provisioning-Profil. Temporaere
    # Keychain mit Zufallspasswort; set-key-partition-list verhindert
    # den GUI-Passwort-Prompt beim Signieren.
    - name: Install signing certificate and provisioning profile
      if: ${{ inputs.certificate-p12-base64 != '' }}
      shell: bash
      env:
        P12_BASE64: ${{ inputs.certificate-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificate-p12-password }}
        PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        rm -f "$RUNNER_TEMP/dist.p12"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
        cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
        rm -f "$RUNNER_TEMP/profile.mobileprovision"
        echo "$KEYCHAIN_PATH" > "$RUNNER_TEMP/keychain-path.txt"
        unset KEYCHAIN_PASSWORD

    # ApplicationDisplayVersion/ApplicationVersion explizit setzen: die
    # csproj pinnt beide fuer lokale Builds. Die Buildnummer ist die
    # Commit-Anzahl - repo-weit monoton, anders als github.run_number,
    # das pro Workflow zaehlt (staging-ci und release wuerden sonst
    # kollidierende CFBundleVersion-Werte erzeugen). run_attempt erhoeht
    # bei Repair-Uploads desselben Commits.
    # ApplicationDisplayVersion akzeptiert nur dreiteilige numerische
    # Versionen - bei Pre-Releases (0.4.0-rc.1) wird der Suffix abgeschnitten
    # (CFBundleShortVersionString muss numerisch sein).
    # MauiXamlInflator=XamlC: die csproj aktiviert SourceGen-XAML, der
    # CodeBehindGenerator der Runner-MAUI-Version erzeugt in der
    # iOS-Kompilierung invaliden Code fuer DataTrigger/MultiTrigger
    # (CS0266 bool?->bool, CS8422 static-Funktion mit this).
    - name: Publish (ios)
      run: |
        set -euo pipefail
        DISPLAY_VERSION="${{ inputs.release-version }}"
        DISPLAY_VERSION="${DISPLAY_VERSION%%-*}"
        BUILD_NUMBER=$(( $(git rev-list --count HEAD) + ${{ github.run_attempt }} - 1 ))
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }} \
          -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
          -p:ApplicationVersion=$BUILD_NUMBER \
          --configuration Release --framework net11.0-ios \
          -p:RuntimeIdentifier=ios-arm64 \
          -p:ArchiveOnBuild=true \
          -p:CodesignKey="${{ inputs.codesign-key }}" \
          -p:CodesignProvision="${{ inputs.provisioning-profile }}" \
          -p:MauiXamlInflator=XamlC \
          --no-restore
      shell: bash
      env:
        IncludeAndroidTarget: false

    - name: Collect iOS package
      shell: bash
      run: |
        set -euo pipefail
        ipas=()
        while IFS= read -r -d '' file; do
          ipas+=("$file")
        done < <(find src/Reporter/bin/Release -name '*.ipa' -print0 | sort -z)
        if [ "${#ipas[@]}" -eq 0 ]; then
          echo "::error::No .ipa artifact found under src/Reporter/bin/Release after publish."
          exit 1
        fi
        # dotnet publish may write the same artifact to both the RID directory and publish/ — deduplicate by basename.
        distinct=$(printf '%s\n' "${ipas[@]##*/}" | sort -u | wc -l)
        if [ "$distinct" -gt 1 ]; then
          echo "::error::Multiple distinct .ipa artifacts found under src/Reporter/bin/Release; expected exactly one:"
          printf '%s\n' "${ipas[@]##*/}" | sort -u
          exit 1
        fi
        ipa=""
        for f in "${ipas[@]}"; do
          case "$f" in */publish/*) ipa="$f"; break;; esac
        done
        if [ -z "$ipa" ]; then ipa="${ipas[0]}"; fi
        cp "$ipa" release-ios.ipa

    # SDK-Gate vor dem Upload: Apples ITMS-90725-Warnung (Build-SDK
    # aelter als gefordert, Frist April 2027: iOS SDK >= 27) waere sonst
    # erst nach dem Upload in App Store Connect sichtbar. DTSDKName,
    # DTPlatformVersion und DTXcode der erzeugten .ipa werden
    # protokolliert; der Job schlaegt fehl, wenn das Build-SDK nicht
    # iphoneos mit Major >= 27 ist - keine inkompatible .ipa erreicht
    # App Store Connect. Schuetzt dauerhaft gegen Runner-/Pin-Drift.
    - name: Verify built SDK version
      run: |
        set -euo pipefail
        TMP="$(mktemp -d)"
        trap 'rm -rf "$TMP"' EXIT
        ditto -x -k release-ios.ipa "$TMP" 2>/dev/null || unzip -q release-ios.ipa -d "$TMP"
        APP="$(find "$TMP/Payload" -maxdepth 1 -name '*.app' | head -1)"
        if [ -z "$APP" ]; then
          echo "::error::No .app bundle found inside release-ios.ipa."
          exit 1
        fi
        SDK_NAME="$(plutil -extract DTSDKName raw -o - "$APP/Info.plist" 2>/dev/null || true)"
        PLATFORM_VERSION="$(plutil -extract DTPlatformVersion raw -o - "$APP/Info.plist" 2>/dev/null || true)"
        XCODE_VERSION="$(plutil -extract DTXcode raw -o - "$APP/Info.plist" 2>/dev/null || true)"
        XCODE_BUILD="$(plutil -extract DTXcodeBuild raw -o - "$APP/Info.plist" 2>/dev/null || true)"
        echo "DTSDKName=$SDK_NAME"
        echo "DTPlatformVersion=$PLATFORM_VERSION"
        echo "DTXcode=$XCODE_VERSION"
        echo "DTXcodeBuild=$XCODE_BUILD"
        SDK_MAJOR=""
        if [[ "$SDK_NAME" =~ ^iphoneos([0-9]+) ]]; then SDK_MAJOR="${BASH_REMATCH[1]}"; fi
        if [ -z "$SDK_MAJOR" ] || [ "$SDK_MAJOR" -lt 27 ]; then
          echo "::error::Built with SDK '$SDK_NAME' - Apple requires iOS SDK >= 27 (release Xcode). Check the ios-workload-version pin and the xcode-path input."
          exit 1
        fi
        echo "SDK gate passed: $SDK_NAME (DTXcode=$XCODE_VERSION)"
      shell: bash

    # TestFlight-Upload: laeuft nur, wenn die API-Key-Secrets gesetzt sind.
    # iTMSTransporter liegt auf den Runnern nicht in Transporter.app -
    # gesucht wird in den Apple-Standardorten (gleiche Liste wie
    # Get-TransporterFindScript in scripts/iOS-Deployment.ps1).
    - name: Upload to TestFlight
      if: ${{ inputs.api-key-p8 != '' }}
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.api-key-id }}
        ASC_ISSUER_ID: ${{ inputs.api-issuer-id }}
        ASC_KEY_P8: ${{ inputs.api-key-p8 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        chmod 700 "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
        # iTMSTransporter finden: Developer/usr/bin (und xcrun) liefern
        # auf aktuellem Xcode nur einen Stub, der 'iTMSTransporter is now
        # part of Transporter' meldet - die echten Orte sind die
        # Transporter.app-Installation und das Standalone-Paket unter
        # /usr/local/itms bzw. das ContentDeliveryServices.framework.
        DEVDIR="$(xcode-select -p 2>/dev/null || true)"
        CANDIDATES=(
          "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "$HOME/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
          "/usr/local/itms/bin/iTMSTransporter"
        )
        if [ -n "$DEVDIR" ]; then
          CANDIDATES+=(
            "$DEVDIR/../SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms/bin/iTMSTransporter"
          )
        fi
        ITMS=""
        for c in "${CANDIDATES[@]}"; do
          if [ -x "$c" ]; then ITMS="$c"; break; fi
        done
        # Fallback: offizielles Standalone-Paket von Apples CDN
        # installieren (Transporter.app ist auf den Runnern nicht
        # vorinstalliert, Xcode liefert nur den Stub).
        if [ -z "$ITMS" ]; then
          echo "Kein funktionierender iTMSTransporter gefunden - installiere Standalone-Paket ..."
          curl -fsSL "https://itunesconnect.apple.com/WebObjects/iTunesConnect.woa/ra/resources/download/public/Transporter__OSX/bin/" \
            -o "$RUNNER_TEMP/itmstransporter.pkg"
          sudo installer -pkg "$RUNNER_TEMP/itmstransporter.pkg" -target /
          rm -f "$RUNNER_TEMP/itmstransporter.pkg"
          if [ -x /usr/local/itms/bin/iTMSTransporter ]; then
            ITMS=/usr/local/itms/bin/iTMSTransporter
          fi
        fi
        if [ -z "$ITMS" ]; then
          echo "::error::iTMSTransporter not found on runner (or only the deprecated stub)."
          exit 1
        fi
        echo "Using iTMSTransporter: $ITMS"
        "$ITMS" -m upload -assetFile release-ios.ipa -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"

    # Keychain-Reste entfernen, auch bei Fehlschlag.
    - name: Remove signing keychain
      if: always()
      shell: bash
      run: |
        KEYCHAIN_PATH="$(cat "$RUNNER_TEMP/keychain-path.txt" 2>/dev/null || true)"
        rm -f "$RUNNER_TEMP/keychain-path.txt" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
        if [ -n "$KEYCHAIN_PATH" ]; then
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        fi
