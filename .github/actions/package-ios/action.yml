name: Package iOS

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature across the packaging actions.
    required: true
  codesign-key:
    description: iOS signing identity passed as -p:CodesignKey (e.g. Apple Distribution), provided by the caller from repository secrets.
    required: false
    default: ''
  provisioning-profile:
    description: iOS provisioning profile passed as -p:CodesignProvision, provided by the caller from repository secrets.
    required: false
    default: ''
  api-key-id:
    description: App Store Connect API key ID. When set together with api-key-p8/api-issuer-id, the built .ipa is uploaded to TestFlight via iTMSTransporter.
    required: false
    default: ''
  api-issuer-id:
    description: App Store Connect API issuer ID.
    required: false
    default: ''
  api-key-p8:
    description: App Store Connect API private key (.p8 contents), provided by the caller from repository secrets.
    required: false
    default: ''
  certificate-p12-base64:
    description: Base64-encoded .p12 export of the distribution certificate including private key (Keychain Access export).
    required: false
    default: ''
  certificate-p12-password:
    description: Password of the exported .p12.
    required: false
    default: ''
  provisioning-profile-base64:
    description: Base64-encoded .mobileprovision file.
    required: false
    default: ''
  ios-workload-version:
    description: Microsoft.iOS.Sdk pack/manifest version to pin before workload restore. Must be compatible with a release Xcode on the runner - App Store rejects builds from beta Xcode.
    required: false
    default: '26.5.10318'

runs:
  using: composite
  steps:
    # SDK-Band 10.0.1xx pinnen: die iOS-Workload-Manifeste werden pro
    # SDK-Band publiziert; 26.x-Manifeste (Release-Xcode-kompatibel)
    # existieren nur im 10.0.100-Feed, der 10.0.400-Feed kennt nur
    # 27.x-Workloads, die Beta-Xcode verlangen (Store lehnt Beta ab).
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.1xx'

    # Workload-Version pinnen: 'workload restore' wuerde sonst das
    # neueste iOS-Manifest ziehen (aktuell 27.x), das Beta-Xcode
    # verlangt - Store-Uploads aus Beta-Xcode werden abgelehnt.
    # 'update --from-rollback-file' pinnt die Manifest-Version, das
    # anschliessende 'restore' installiert exakt diese (vgl.
    # dotnet/sdk workload-rollback; ein --from-rollback-file direkt
    # an 'workload restore' kollidiert mit --skip-manifest-update).
    - name: Install .NET MAUI workload
      run: |
        set -euo pipefail
        printf '{"microsoft.net.sdk.ios": "%s"}\n' "${{ inputs.ios-workload-version }}" > "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload update --from-rollback-file "$RUNNER_TEMP/workload-rollback.json"
        dotnet workload restore Reporter.sln
        # Auf dem Runner vorinstallierte iOS-Packs anderer Version
        # entfernen: die TPV-Resolution wuerde sonst das neueste Pack
        # waehlen - unabhaengig vom gepinnten Manifest.
        for d in "$HOME"/.dotnet/packs/Microsoft.iOS.Sdk.net10.0_*/*/; do
          [ -d "$d" ] || continue
          [ "$(basename "$d")" = "${{ inputs.ios-workload-version }}" ] || rm -rf "$(dirname "$d")"
        done
      shell: bash
      env:
        IncludeAndroidTarget: false

    # -r ios-arm64 ist Pflicht: publish unten laeuft mit
    # --no-restore und braucht das RID-Ziel im assets file.
    - name: Restore
      run: dotnet restore src/Reporter/Reporter.csproj -r ios-arm64
      shell: bash
      env:
        IncludeAndroidTarget: false

    # Signatur-Material importieren: das Runner-Image hat weder
    # Distribution-Zertifikat noch Provisioning-Profil. Temporaere
    # Keychain mit Zufallspasswort; set-key-partition-list verhindert
    # den GUI-Passwort-Prompt beim Signieren.
    - name: Install signing certificate and provisioning profile
      if: ${{ inputs.certificate-p12-base64 != '' }}
      shell: bash
      env:
        P12_BASE64: ${{ inputs.certificate-p12-base64 }}
        P12_PASSWORD: ${{ inputs.certificate-p12-password }}
        PROFILE_BASE64: ${{ inputs.provisioning-profile-base64 }}
      run: |
        set -euo pipefail
        KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
        KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        echo "$P12_BASE64" | base64 -d > "$RUNNER_TEMP/dist.p12"
        security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -T /usr/bin/productbuild
        rm -f "$RUNNER_TEMP/dist.p12"
        EXISTING=$(security list-keychains -d user | tr -d '"')
        security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING
        security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
        mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
        echo "$PROFILE_BASE64" | base64 -d > "$RUNNER_TEMP/profile.mobileprovision"
        cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/"
        rm -f "$RUNNER_TEMP/profile.mobileprovision"
        echo "$KEYCHAIN_PATH" > "$RUNNER_TEMP/keychain-path.txt"
        unset KEYCHAIN_PASSWORD

    # ApplicationDisplayVersion/ApplicationVersion explizit setzen: die
    # csproj pinnt beide fuer lokale Builds. Die Buildnummer ist der
    # monoton steigende Run-Zaehler (eindeutig pro Version-Train).
    - name: Publish (ios)
      run: >
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }}
        -p:ApplicationDisplayVersion=${{ inputs.release-version }}
        -p:ApplicationVersion=${{ github.run_number }}
        --configuration Release --framework net10.0-ios
        -p:RuntimeIdentifier=ios-arm64
        -p:ArchiveOnBuild=true
        -p:CodesignKey="${{ inputs.codesign-key }}"
        -p:CodesignProvision="${{ inputs.provisioning-profile }}"
        --no-restore
      shell: bash
      env:
        IncludeAndroidTarget: false

    - name: Collect iOS package
      shell: bash
      run: |
        set -euo pipefail
        ipas=()
        while IFS= read -r -d '' file; do
          ipas+=("$file")
        done < <(find src/Reporter/bin/Release -name '*.ipa' -print0 | sort -z)
        if [ "${#ipas[@]}" -eq 0 ]; then
          echo "::error::No .ipa artifact found under src/Reporter/bin/Release after publish."
          exit 1
        fi
        # dotnet publish may write the same artifact to both the RID directory and publish/ — deduplicate by basename.
        distinct=$(printf '%s\n' "${ipas[@]##*/}" | sort -u | wc -l)
        if [ "$distinct" -gt 1 ]; then
          echo "::error::Multiple distinct .ipa artifacts found under src/Reporter/bin/Release; expected exactly one:"
          printf '%s\n' "${ipas[@]##*/}" | sort -u
          exit 1
        fi
        ipa=""
        for f in "${ipas[@]}"; do
          case "$f" in */publish/*) ipa="$f"; break;; esac
        done
        if [ -z "$ipa" ]; then ipa="${ipas[0]}"; fi
        cp "$ipa" release-ios.ipa

    # TestFlight-Upload: laeuft nur, wenn die API-Key-Secrets gesetzt sind.
    # iTMSTransporter liegt auf den Runnern nicht in Transporter.app -
    # gesucht wird in den Apple-Standardorten (gleiche Liste wie
    # Get-TransporterFindScript in scripts/iOS-Deployment.ps1).
    - name: Upload to TestFlight
      if: ${{ inputs.api-key-p8 != '' }}
      shell: bash
      env:
        ASC_KEY_ID: ${{ inputs.api-key-id }}
        ASC_ISSUER_ID: ${{ inputs.api-issuer-id }}
        ASC_KEY_P8: ${{ inputs.api-key-p8 }}
      run: |
        set -euo pipefail
        mkdir -p "$HOME/.appstoreconnect/private_keys"
        chmod 700 "$HOME/.appstoreconnect/private_keys"
        printf '%s' "$ASC_KEY_P8" > "$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
        ITMS=""
        for c in "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter" \
                 "$HOME/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter" \
                 "/usr/local/itms/bin/iTMSTransporter"; do
          [ -x "$c" ] && { ITMS="$c"; break; }
        done
        if [ -z "$ITMS" ] || [ ! -x "$ITMS" ]; then ITMS="$(xcrun -f iTMSTransporter 2>/dev/null || true)"; fi
        if [ -z "$ITMS" ] || [ ! -x "$ITMS" ]; then
          DEVDIR="$(xcode-select -p 2>/dev/null || true)"
          if [ -n "$DEVDIR" ]; then
            for c in "$DEVDIR/usr/bin/iTMSTransporter" \
                     "$DEVDIR/../SharedFrameworks/ContentDeliveryServices.framework/Versions/A/itms/bin/iTMSTransporter"; do
              [ -x "$c" ] && { ITMS="$c"; break; }
            done
          fi
        fi
        if [ -z "$ITMS" ] || [ ! -x "$ITMS" ]; then
          echo "::error::iTMSTransporter not found on runner."
          exit 1
        fi
        "$ITMS" -m upload -assetFile release-ios.ipa -apiKey "$ASC_KEY_ID" -apiIssuer "$ASC_ISSUER_ID"

    # Keychain-Reste entfernen, auch bei Fehlschlag.
    - name: Remove signing keychain
      if: always()
      shell: bash
      run: |
        KEYCHAIN_PATH="$(cat "$RUNNER_TEMP/keychain-path.txt" 2>/dev/null || true)"
        rm -f "$RUNNER_TEMP/keychain-path.txt" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision"
        if [ -n "$KEYCHAIN_PATH" ]; then
          security list-keychains -d user -s login.keychain-db || true
          security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
        fi
