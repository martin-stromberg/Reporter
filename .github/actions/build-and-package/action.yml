name: Build and package

inputs:
  release-version:
    description: Version without a leading v, written into update.json and passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1), used to build each asset's download URL.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI workload
      run: dotnet workload restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false

    - name: Restore
      run: dotnet restore Reporter.sln -r win-x64
      shell: bash
      env:
        IncludeIosTarget: false

    - name: Publish (win-x64, self-contained)
      run: >
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }}
        --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64
        --self-contained true -p:PublishReadyToRun=false --no-restore --output artifacts/publish-win-x64
      shell: bash
      env:
        IncludeIosTarget: false

    - name: Create release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "artifacts/publish-win-x64/*" -DestinationPath "release-win-x64.zip" -Force

    - name: Create update manifest
      shell: pwsh
      env:
        VERSION: ${{ inputs.release-version }}
        TAG: ${{ inputs.release-tag }}
      run: |
        $win = Get-Item "release-win-x64.zip"
        $winHash = (Get-FileHash -Path $win.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
        $manifest = @{
          version = $env:VERSION
          releaseNotes = "Reporter release $env:TAG"
          publishedAt = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          assets = @(
            @{
              platform = "windows"
              runtimeIdentifier = "win-x64"
              assetName = "release-win-x64.zip"
              assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/release-win-x64.zip"
              sha256 = $winHash
              sizeBytes = $win.Length
            }
          )
        }
        $manifest | ConvertTo-Json -Depth 4 | Set-Content -Path "update.json" -Encoding UTF8
