name: Build and package

inputs:
  release-version:
    description: Version without a leading v, passed as -p:Version.
    required: true
  release-tag:
    description: Release tag (e.g. v1.2.3 or v1.2.3-rc.1). Kept for a stable call signature; the update manifest is built by scripts/create-update-manifest.mjs in the aggregating job.
    required: true

runs:
  using: composite
  steps:
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - name: Install .NET MAUI workload
      run: dotnet workload restore Reporter.sln
      shell: bash
      env:
        IncludeIosTarget: false

    - name: Restore
      run: dotnet restore Reporter.sln -r win-x64
      shell: bash
      env:
        IncludeIosTarget: false

    # ApplicationDisplayVersion/ApplicationVersion muessen explizit gesetzt
    # werden: die csproj pinnt beide fuer lokale Builds, -p:Version allein
    # wuerde nicht durchschlagen. Als Buildnummer dient die Commit-Anzahl
    # (repo-weit monoton - github.run_number zaehlt nur pro Workflow).
    # ApplicationDisplayVersion akzeptiert nur dreiteilige numerische
    # Versionen - bei Pre-Releases (0.4.0-rc.1) wird der Suffix abgeschnitten.
    - name: Publish (win-x64, self-contained)
      run: |
        set -euo pipefail
        DISPLAY_VERSION="${{ inputs.release-version }}"
        DISPLAY_VERSION="${DISPLAY_VERSION%%-*}"
        BUILD_NUMBER=$(( $(git rev-list --count HEAD) + ${{ github.run_attempt }} - 1 ))
        dotnet publish src/Reporter/Reporter.csproj -p:Version=${{ inputs.release-version }} \
          -p:ApplicationDisplayVersion="$DISPLAY_VERSION" \
          -p:ApplicationVersion=$BUILD_NUMBER \
          --configuration Release --framework net10.0-windows10.0.19041.0 --runtime win-x64 \
          --self-contained true -p:PublishReadyToRun=false --no-restore --output artifacts/publish-win-x64
      shell: bash
      env:
        IncludeIosTarget: false

    - name: Create release ZIP
      shell: pwsh
      run: |
        Compress-Archive -Path "artifacts/publish-win-x64/*" -DestinationPath "release-win-x64.zip" -Force
