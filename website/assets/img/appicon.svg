<svg width="456" height="456" viewBox="0 0 456 456" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <!-- Composed app icon: #1e293b background (appicon.svg) plus the badge
       foreground (appiconfg.svg) scaled to fill the icon, as MauiIcon does. -->
  <rect x="0" y="0" width="456" height="456" fill="#1e293b" />
  <g transform="scale(1.14)">
    <!-- Outer Rounded Badge Frame -->
    <rect x="30" y="30" width="340" height="340" rx="72" fill="#ffffff" stroke="#1e293b" stroke-width="22" stroke-linejoin="round"></rect>

    <!-- 1. Warm Amber Accent Publication Dot -->
    <circle cx="140" cy="270" r="32" fill="#f59e0b"></circle>

    <!-- 2. Inner RSS Signal Wave Arc -->
    <path d="M 112 186 A 84 84 0 0 1 224 298" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"></path>

    <!-- 3. Outer RSS Signal Wave Arc -->
    <path d="M 112 122 A 148 148 0 0 1 288 298" fill="none" stroke="#1e293b" stroke-width="26" stroke-linecap="round"></path>
  </g>
</svg>
